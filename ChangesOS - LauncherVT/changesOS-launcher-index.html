<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changes.OS</title>
    <link rel="stylesheet" href="changesOS-launcher-style.css">
</head>

<body>

<main class="launcher">

    <header>
        <h1>CHANGES.OS</h1>
        <p>LAUNCHER</p>
    </header>

    <section class="app-grid">

        <!-- GOOGLE / SERVIÇOS -->
        <a class="app google google-1"
           href="https://www.google.com/"
           target="_blank"
           rel="noopener noreferrer">
            <img src="https://www.google.com/s2/favicons?domain=google.com&sz=128" alt="Google">
            <span>Google</span>
        </a>

        <a class="app google google-2"
           href="https://www.youtube.com/"
           target="_blank"
           rel="noopener noreferrer">
            <img src="https://www.google.com/s2/favicons?domain=youtube.com&sz=128" alt="YouTube">
            <span>YouTube</span>
        </a>

        <a class="app google google-3"
           href="https://mail.google.com/"
           target="_blank"
           rel="noopener noreferrer">
            <img src="https://www.google.com/s2/favicons?domain=gmail.com&sz=128" alt="Gmail">
            <span>Gmail</span>
        </a>

        <a class="app google google-4"
           href="https://drive.google.com/"
           target="_blank"
           rel="noopener noreferrer">
            <img src="https://www.google.com/s2/favicons?domain=drive.google.com&sz=128" alt="Drive">
            <span>Drive</span>
        </a>

        <!-- STREAMING -->
        <a class="app streaming streaming-1"
           href="https://www.netflix.com/"
           target="_blank"
           rel="noopener noreferrer">
            <img src="https://www.google.com/s2/favicons?domain=netflix.com&sz=128" alt="Netflix">
            <span>Netflix</span>
        </a>

        <a class="app streaming streaming-2"
           href="https://www.primevideo.com/"
           target="_blank"
           rel="noopener noreferrer">
            <img src="https://www.google.com/s2/favicons?domain=primevideo.com&sz=128" alt="Prime Video">
            <span>Prime Video</span>
        </a>

        <a class="app streaming streaming-3"
           href="https://open.spotify.com/"
           target="_blank"
           rel="noopener noreferrer">
            <img src="https://www.google.com/s2/favicons?domain=spotify.com&sz=128" alt="Spotify">
            <span>Spotify</span>
        </a>

        <a class="app streaming streaming-4"
           href="https://www.max.com/"
           target="_blank"
           rel="noopener noreferrer">
            <img src="https://www.google.com/s2/favicons?domain=max.com&sz=128" alt="Max">
            <span>Max</span>
        </a>

        <a class="app streaming streaming-5"
           href="https://pluto.tv/"
           target="_blank"
           rel="noopener noreferrer">
            <img src="https://www.google.com/s2/favicons?domain=pluto.tv&sz=128" alt="Pluto TV">
            <span>Pluto TV</span>
        </a>

        <!-- REDES SOCIAIS -->
        <a class="app social social-1"
           href="https://web.whatsapp.com/"
           target="_blank"
           rel="noopener noreferrer">
            <img src="https://www.google.com/s2/favicons?domain=web.whatsapp.com&sz=128" alt="WhatsApp">
            <span>WhatsApp</span>
        </a>

        <a class="app social social-2"
           href="https://www.instagram.com/"
           target="_blank"
           rel="noopener noreferrer">
            <img src="https://www.google.com/s2/favicons?domain=instagram.com&sz=128" alt="Instagram">
            <span>Instagram</span>
        </a>

        <a class="app social social-3"
           href="https://www.facebook.com/"
           target="_blank"
           rel="noopener noreferrer">
            <img src="https://www.google.com/s2/favicons?domain=facebook.com&sz=128" alt="Facebook">
            <span>Facebook</span>
        </a>

        <a class="app social social-4"
           href="https://chatgpt.com/"
           target="_blank"
           rel="noopener noreferrer">
            <img src="https://www.google.com/s2/favicons?domain=chatgpt.com&sz=128" alt="ChatGPT">
            <span>ChatGPT AI</span>
        </a>

        <a class="app social social-5"
           href="https://x.com/"
           target="_blank"
           rel="noopener noreferrer">
            <img src="https://www.google.com/s2/favicons?domain=x.com&sz=128" alt="X">
            <span>X</span>
        </a>

        <a class="app social social-6"
           href="https://www.tiktok.com/"
           target="_blank"
           rel="noopener noreferrer">
            <img src="https://www.google.com/s2/favicons?domain=tiktok.com&sz=128" alt="TikTok">
            <span>TikTok</span>
        </a>

        <!-- SISTEMA -->
        <a class="app system system-1 system-app"
           href="#"
           data-action="files">
            <img src="https://www.google.com/s2/favicons?domain=files.com&sz=128" alt="Arquivos">
            <span>Arquivos</span>
        </a>

        <a class="app system system-2 system-app"
           href="#"
           data-action="terminal">
            <img src="https://www.google.com/s2/favicons?domain=terminal.com&sz=128" alt="Terminal">
            <span>Terminal</span>
        </a>

        <a class="app system system-3 system-app"
           href="#"
           data-action="settings">
            <img src="https://www.google.com/s2/favicons?domain=settings.com&sz=128" alt="Configurações">
            <span>Configurações</span>
        </a>

        <!-- VOLTAR -->
        <a class="app back-button"
           href="../index.html">
            <img src="https://www.google.com/s2/favicons?domain=home.com&sz=128" alt="Voltar">
            <span>Voltar</span>
        </a>

    </section>
</main>

<script src="changesOS-launcher-script.js"></script>
</body>
</html>
